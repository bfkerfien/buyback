services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.buyback.rule=Host(${BUYBACK_DOMAIN:-buyback.example.com})"
      - "traefik.http.routers.buyback.entrypoints=websecure"
      - "traefik.http.routers.buyback.tls=true"
      - "traefik.http.routers.buyback.tls.certresolver=letsencrypt"
      - "traefik.http.services.buyback.loadbalancer.server.port=8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./bin/worker"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - internal

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: buyback
      MARIADB_USER: buyback
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - buyback-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buyback-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  buyback-db:
  buyback-cache:

networks:
  internal:
    driver: bridge
  traefik:
    external: true
