services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && php -r '$$s=@fsockopen(\"127.0.0.1\",9000); exit($$s ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - buyback-storage:/var/www/html/storage
      - ./data:/var/www/html/data:ro
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.buyback.rule=Host("${BUYBACK_DOMAIN:?Set BUYBACK_DOMAIN in .env}")"
      - "traefik.http.routers.buyback.entrypoints=websecure"
      - "traefik.http.routers.buyback.tls=true"
      - "traefik.http.routers.buyback.tls.certresolver=letsencrypt"
      - "traefik.http.services.buyback.loadbalancer.server.port=80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=80"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - buyback-storage:/var/www/html/storage
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - buyback-storage:/var/www/html/storage
    networks:
      - internal

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-buyback}
      MARIADB_USER: ${DB_USERNAME:-buyback}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - buyback-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - buyback-cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

volumes:
  buyback-db:
  buyback-cache:
  buyback-storage:

networks:
  internal:
    driver: bridge
  traefik:
    external: true
