name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
      - name: Resolve Composer dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Upload resolved Composer lockfile
        uses: actions/upload-artifact@v4
        with:
          name: composer-lockfile
          path: composer.lock
          if-no-files-found: error
      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          php artisan package:discover --ansi
      - name: Check deployment script syntax
        run: bash -n deploy.sh
      - name: Check PHP syntax
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run test suite
        run: vendor/bin/phpunit

  docker:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: composer-lockfile
          path: .
      - name: Configure CI environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/' .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all deployment images
        run: docker compose build --pull app web worker
      - name: Start database and Redis
        run: docker compose up -d --wait db cache
      - name: Apply migrations against MariaDB
        run: docker compose run --rm --no-deps app php artisan migrate --force
      - name: Cache production configuration and views
        run: |
          docker compose run --rm --no-deps app php artisan config:cache
          docker compose run --rm --no-deps app php artisan view:cache
      - name: Verify Laravel route registration
        run: docker compose run --rm --no-deps app php artisan route:list --except-vendor
      - name: Clean up CI containers
        if: always()
        run: docker compose down -v

  lockfile:
    if: github.event_name == 'pull_request'
    needs: [unit, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@v4
        with:
          name: composer-lockfile
          path: .
      - name: Commit the tested Composer lockfile to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if git diff --cached --quiet; then
            echo 'Composer lockfile is already current.'
            exit 0
          fi
          git commit -m 'Add tested Composer dependency lockfile'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
