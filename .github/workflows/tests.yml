name: Tests

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit
