name: Tests

on:
  push:
    branches: [main, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql
          coverage: none
      - name: Resolve Composer dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run test suite
        run: vendor/bin/phpunit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build PHP-FPM application image
        run: docker build --pull -t triglavian-buyback:ci .
      - name: Build Nginx frontend image
        run: docker build --pull -f docker/nginx/Dockerfile -t triglavian-buyback-web:ci .
